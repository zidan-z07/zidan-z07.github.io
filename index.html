/* ==========================================================================

:root {
  /* Color: cool mineral neutrals, a kiln-orange accent, a deep teal second.
     Every text color here is checked at 4.5:1 or better against bg, surface and surface-2. */
  --bg: #edf0ee;
  --surface: #f8faf9;
  --surface-2: #e2e8e5;
  --ink: #111b1c;
  --muted: #4a5a60;
  --line: #cdd7d4;
  --accent: #ad3d0b;
  --accent-2: #0d6e69;
  --on-accent: #ffffff;
  --rim: #ffffff;
  --shadow: 0 1px 0 rgba(17, 27, 28, .04), 0 22px 44px -28px rgba(17, 27, 28, .45);

  /* Type */
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --step--1: .8125rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: clamp(1.4rem, 2.2vw, 1.75rem);
  --step-3: clamp(1.9rem, 4vw, 3rem);
  --step-4: clamp(2.6rem, 8.5vw, 6.4rem);
  --label: .75rem;               /* smallest text on the page: 12px */

  /* Space & shape */
  --radius: 16px;
  --wrap: 1200px;
  --gutter: max(clamp(16px, 4vw, 44px), env(safe-area-inset-left, 0px));
  --gutter-r: max(clamp(16px, 4vw, 44px), env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .7, .2, 1);

  color-scheme: light;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--bg);
}
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--on-accent); }

.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter-r);
}

.skip {
  position: absolute; left: 12px; top: -60px; z-index: 100;
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px;
}
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

.kicker {
  font-family: var(--font-mono);
  font-size: var(--step--1);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.kicker::before { content: ""; width: 18px; height: 2px; background: var(--accent); flex: none; }

/* Until main.js renders the content, keep it invisible so it can't shift. Failsafe: it shows after 3s even if the script never runs. */
.js-pending main, .js-pending .footer { visibility: hidden; animation: failsafe-show 0s 3s forwards; }
@keyframes failsafe-show { to { visibility: visible; } }

/* ---------- Scroll progress ---------- */
.progress {
  position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px);
  height: 2px; z-index: 70; pointer-events: none;
}
.progress span {
  display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transform-origin: 0 50%; transform: scaleX(0);
}

/* ---------- Nav ---------- */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.nav__inner { display: flex; align-items: center; gap: 16px; height: 64px; }
.nav__brand {
  font-family: var(--font-display); font-weight: 800; font-size: .95rem;
  text-decoration: none; letter-spacing: -.01em; white-space: nowrap;
}
.nav__brand span { color: var(--accent); }
.nav__links { display: flex; gap: 4px; margin-left: auto; }
.nav__links a {
  text-decoration: none; font-size: .9rem; font-weight: 500; color: var(--muted);
  padding: 8px 12px; border-radius: 99px; transition: color .2s, background-color .2s;
}
.nav__links a:hover { color: var(--ink); background: var(--surface-2); }
.nav__links a[aria-current="true"] { color: var(--ink); background: var(--surface-2); }
.nav__actions { display: flex; gap: 6px; }
.icon-btn {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  transition: transform .2s var(--ease), border-color .2s;
}
.icon-btn:hover { border-color: var(--accent); transform: rotate(-12deg); }
.nav__menu { display: none; }

@media (max-width: 860px) {
  .nav__menu { display: grid; }
  .nav__actions { margin-left: auto; }
  .nav__links {
    position: absolute; top: 64px; left: 0; right: 0; margin: 0;
    flex-direction: column; gap: 2px;
    padding: 10px var(--gutter-r) 16px var(--gutter);
    background: var(--bg); border-bottom: 1px solid var(--line);
    display: none;
  }
  .nav[data-open="true"] .nav__links { display: flex; }
  .nav__links a { padding: 12px 14px; font-size: 1rem; }
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font: 600 1rem/1 var(--font-body);
  padding: 14px 20px; border-radius: 99px; text-decoration: none; cursor: pointer;
  border: 1px solid transparent; transition: transform .25s var(--ease), box-shadow .25s, background-color .2s, border-color .2s;
}
.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 30px -12px var(--accent); }
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -12px var(--accent); }
.btn--ghost { border-color: var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--ink); }
.btn--ghost:hover { border-color: var(--ink); transform: translateY(-2px); }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- Hero: a video that moves forward as you scroll ---------- */
.hero { position: relative; --nav-h: calc(65px + env(safe-area-inset-top, 0px)); }
.hero__stage { position: relative; }
/* Phones and short windows: the video is a band pinned under the nav while the intro text scrolls past. */
.hero__media {
  position: sticky; top: var(--nav-h); z-index: 2;
  width: 100%; aspect-ratio: 16 / 9; max-height: 44vh; overflow: hidden; background: #091112;
}
.hero__video { display: block; width: 100%; height: 100%; object-fit: cover; }
.hero__media::after {
  content: ""; position: absolute; inset: auto 0 0; height: 24px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--bg));
}
.hero__inner { padding-block: 28px clamp(40px, 8vh, 72px); display: grid; gap: 20px; justify-items: start; }
.no-scrub .hero__media { position: relative; top: auto; }

/* Larger screens: the video fills the screen and stays put while the scroll plays it. */
@media (min-width: 861px) and (min-height: 620px) {
  .hero { height: 240vh; }
  .hero__stage {
    position: sticky; top: var(--nav-h);
    height: calc(100vh - var(--nav-h)); height: calc(100svh - var(--nav-h));
    display: flex; align-items: flex-end; overflow: hidden; isolation: isolate;
    /* The text sits on the video, so it keeps the dark palette in both themes. */
    --ink: #e3ebe9; --muted: #c6d2d1; --line: rgba(227, 235, 233, .3); --surface: #0f1b1d;
    --accent: #ff8a4c; --accent-2: #63d1c8; --on-accent: #1a0c04; --name-fill: #081011;
    color: var(--ink);
  }
  .hero__media { position: absolute; inset: 0; z-index: -1; aspect-ratio: auto; max-height: none; }
  .hero__media::after {
    inset: 0; height: auto; opacity: var(--hero-fade, 1);
    background:
      linear-gradient(90deg, rgba(5, 10, 11, .94) 0%, rgba(5, 10, 11, .86) 30%, rgba(5, 10, 11, .5) 52%, rgba(5, 10, 11, 0) 80%),
      linear-gradient(to top, rgba(5, 10, 11, .72), rgba(5, 10, 11, 0) 46%);
  }
  .hero__inner {
    width: 100%; padding-block: 40px clamp(36px, 7vh, 76px);
    opacity: var(--hero-fade, 1);
    transform: translateY(calc((1 - var(--hero-fade, 1)) * -28px));
  }
  .hero.is-clear .hero__inner { visibility: hidden; }
  .no-scrub .hero { height: auto; }
  .no-scrub .hero__stage { position: relative; top: auto; }
  .no-scrub .hero__media { position: absolute; inset: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .hero { height: auto !important; }
}

/* Short windows: tighten the intro so nothing slides under the menu bar. */
@media (min-width: 861px) and (min-height: 620px) and (max-height: 860px) {
  .hero__inner { gap: 12px; padding-block: 14px 22px; }
  .hero__name { font-size: min(var(--step-4), 16vh); }
  .hero__tagline { max-width: 70ch; font-size: 1rem; }
  .hero__meta { margin-top: 2px; }
}

.hero__status {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: var(--step--1);
  padding: 6px 14px 6px 10px; border-radius: 99px;
  border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 75%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); position: relative; }
.pulse::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent-2);
  animation: ping 1.8s var(--ease) infinite;
}
@keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

.hero__name {
  font-family: var(--font-display);
  font-size: var(--step-4);
  font-weight: 800;
  line-height: .92;
  letter-spacing: -.035em;
  display: grid;
}
.hero__name .line { display: block; }
.hero__name .line--outline {
  color: transparent;
  -webkit-text-stroke: 1.5px var(--ink);
  font-weight: 600;
}
@supports not (-webkit-text-stroke: 1px black) {
  .hero__name .line--outline { color: var(--ink); }
}
/* The font's letter shapes overlap inside, and a plain outline shows those seams. So the outline is
   two layers: a thick solid copy of the word, and a background-colored copy on top that leaves only the edge. */
@supports (-webkit-text-stroke: 1px black) {
  .hero__name .line--outline { position: relative; color: var(--ink); -webkit-text-stroke: 3px var(--ink); }
  .hero__name .line--outline::after {
    content: attr(data-text); position: absolute; left: 0; top: 0;
    color: var(--name-fill, var(--bg)); -webkit-text-stroke: 0;
  }
}
/* Phones: the outline is too thin to read at this size, so fill it solid. */
@media (max-width: 599px) {
  .hero__name .line--outline { color: var(--ink); -webkit-text-stroke: 0; }
  .hero__name .line--outline::after { content: none; }
}
.hero__role {
  font-family: var(--font-display); font-weight: 400; font-size: var(--step-1);
  letter-spacing: -.01em;
}
.hero__tagline { max-width: 52ch; color: var(--muted); font-size: 1.125rem; }
.hero__cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.hero__meta {
  display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 12px 0 0;
  font-family: var(--font-mono); font-size: var(--step--1);
}
.hero__meta div { display: grid; gap: 2px; }
.hero__meta dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: var(--label); }
.hero__meta dd { margin: 0; }

/* ---------- Sections ---------- */
.section { padding-block: clamp(44px, 8vw, 112px); border-top: 1px solid var(--line); }
.section__grid {
  display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
  gap: clamp(20px, 5vw, 72px); align-items: start;
}
.section__label { position: sticky; top: 104px; display: grid; gap: 10px; }
.section__title { font-family: var(--font-display); font-weight: 600; font-size: var(--step-2); letter-spacing: -.02em; line-height: 1.15; }
.section__body { display: grid; gap: 40px; min-width: 0; }
.minor-title {

  text-transform: uppercase; letter-spacing: .08em;
}

@media (max-width: 860px) {

/* Entrance: content is always visible; this only adds a short 3D settle when it scrolls in.
   It never starts from fully transparent, so a slow or skipped animation can't leave a blank. */
.js-motion .reveal.in { animation: settle .7s var(--ease) backwards; }
@keyframes settle {
  from { transform: perspective(1100px) rotateX(10deg) translateY(28px); opacity: .4; }
}

/* ---------- Shared 3D tilt (anything with data-tilt) ---------- */
[data-tilt] {
  --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 50%; --glare: 0;
  position: relative;
  transform: perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));
  transform-style: preserve-3d;
  transition: transform .5s var(--ease), box-shadow .4s, border-color .3s;
}
[data-tilt].is-tilting {
  transition: transform .08s linear, box-shadow .4s, border-color .3s;
  box-shadow: var(--shadow);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
}
[data-tilt]::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
  background: radial-gradient(420px circle at var(--gx) var(--gy), color-mix(in srgb, var(--rim) 40%, transparent), transparent 55%);
  opacity: var(--glare); transition: opacity .3s; mix-blend-mode: soft-light;
}

/* ---------- About ---------- */
.about { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
.prose { max-width: 64ch; font-size: 1.1rem; min-width: 0; color: color-mix(in srgb, var(--ink) 88%, var(--muted)); }

.idcard {
  border-radius: 20px; padding: 24px; display: grid; gap: 8px; overflow: hidden;
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 60%),

.idcard__school { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.03em; line-height: 1.05; transform: translateZ(30px); }
.idcard__degree { font-weight: 500; line-height: 1.4; transform: translateZ(20px); }
.idcard__grad {

@media (max-width: 960px) {

/* ---------- Experience timeline ---------- */
.timeline-wrap { position: relative; min-width: 0; }
.timeline__track {
  position: absolute; left: 9px; top: 18px; bottom: 18px; width: 2px; border-radius: 2px;
  background: var(--line); overflow: hidden;
}
.timeline__fill {
  position: absolute; inset: 0; transform-origin: 50% 0; transform: scaleY(1);
  background: linear-gradient(var(--accent), var(--accent-2));
  box-shadow: 0 0 14px var(--accent);
}
.timeline { display: grid; gap: 14px; min-width: 0; }
.job { position: relative; padding-left: 44px; perspective: 1200px; }
.job__dot {
  position: absolute; left: 1px; top: 30px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--line); transition: border-color .4s, background-color .4s, box-shadow .4s;
}
.job.lit .job__dot { border-color: var(--accent-2); }
.job--current .job__dot { border-color: var(--accent); }
.job--current.lit .job__dot { background: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 22px var(--accent); }
.job__card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: clamp(16px, 3vw, 26px); display: grid; gap: 10px; min-width: 0;
}
.job__card { grid-template-columns: minmax(0, 1fr) clamp(150px, 30%, 220px); column-gap: clamp(16px, 3vw, 26px); align-items: start; }
.job__body { display: grid; gap: 10px; min-width: 0; }
.job__head { display: grid; gap: 8px; }
/* One picture per job, on the right of the card. Jobs without a photo show their initials. */
.job__media {
  display: block; width: 100%; aspect-ratio: 4 / 3; margin: 0; padding: 0; border-radius: 14px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
  transform: translateZ(24px);
}
.job__media img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
button.job__media { cursor: pointer; font: inherit; }
.job__pics { display: grid; gap: 10px; align-content: start; min-width: 0; }
button.job__media:hover img { transform: scale(1.04); }
button.job__media:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.job__media--mono {
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -.03em;
}
.job--current .job__media--mono { color: var(--accent); }
.job__titles { display: grid; gap: 4px; min-width: 0; transform: translateZ(16px); }
.job__role { font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); letter-spacing: -.015em; line-height: 1.25; }
.job__company { color: var(--accent); font-weight: 600; }
.job__sub { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); font-size: 1rem; }
.job__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.job__now {
  font-family: var(--font-mono); font-size: var(--label); letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 2px 8px;
}
.job__when { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); font-weight: 500; }
.job__summary { max-width: 70ch; }
.job__wins { display: grid; gap: 8px; }
.job__wins li { position: relative; padding-left: 22px; max-width: 72ch; }
.job__wins li::before {
  content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px;
  border: 2px solid var(--accent); transform: rotate(45deg);
}
@media (max-width: 640px) {
  .job { padding-left: 34px; }
  .job__card { grid-template-columns: minmax(0, 1fr); row-gap: 14px; }
  .job__media { order: -1; aspect-ratio: 16 / 10; }
  .job__media--mono { display: none; }
  .job__pics { order: -1; grid-template-columns: 1fr 1fr; }
  .job__pics .job__media { aspect-ratio: 1 / 1; }
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono); font-size: var(--label); padding: 4px 10px; border-radius: 99px;
  background: var(--surface-2); color: var(--ink); white-space: nowrap;
}

/* ---------- On campus (inside Experience) ---------- */
.subhead { font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); letter-spacing: -.015em; margin-bottom: 14px; }
.lead-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; min-width: 0; }
.lead {
  border-radius: var(--radius); border: 1px solid var(--line); padding: 20px 22px; display: grid; gap: 6px; align-content: start;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent-2) 10%, var(--surface)), var(--surface) 55%);
}
.lead__top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.lead__title { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; letter-spacing: -.015em; line-height: 1.25; }
.lead__badge { font-family: var(--font-mono); font-size: var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-2); border: 1px solid currentColor; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.lead__org { color: var(--accent); font-weight: 600; font-size: 1rem; }

/* ---------- Projects ---------- */
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; min-width: 0; }
.card {
  border-radius: calc(var(--radius) + 4px); background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; min-width: 0;
}
.card--featured { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.card__media { position: relative; padding: 10px; display: grid; gap: 8px; align-content: start; transform: translateZ(34px); }
.card__thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.card__status {
  font-family: var(--font-mono); font-size: var(--label); letter-spacing: .04em;
  padding: 5px 10px 5px 22px; border-radius: 99px; color: var(--ink); position: relative;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.card__media .card__status { position: absolute; top: 22px; left: 22px; z-index: 2; }
.card__body .card__status { background: var(--surface-2); padding-block: 2px; }
.card__status::before { content: ""; position: absolute; left: 9px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--accent); }
.card__status--ok::before { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }

.photo { margin: 0; position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: #f8f8f8; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.card__thumbs .photo { aspect-ratio: 16 / 10; }

.card__body { padding: 18px 24px 24px; display: grid; gap: 12px; transform: translateZ(22px); flex: 1; align-content: start; min-width: 0; }
.card--featured .card__body { padding: 26px 28px 28px 18px; align-content: center; }
.card--text .card__body { padding: 22px 24px 24px; }
.card__eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-family: var(--font-mono); font-size: var(--label); color: var(--muted); }
.card__flag { color: var(--on-accent); background: var(--accent); border-radius: 99px; padding: 2px 9px; letter-spacing: .08em; text-transform: uppercase; font-size: var(--label); }
.card__title { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; letter-spacing: -.015em; line-height: 1.25; }
.card--featured .card__title { font-size: clamp(1.4rem, 2.6vw, 2rem); letter-spacing: -.03em; }
.card__collab { font-weight: 600; color: var(--accent-2); font-size: 1rem; }
.card__collab a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.card__collab a:hover { color: var(--ink); }
.card__desc { color: color-mix(in srgb, var(--ink) 88%, var(--muted)); }

/* "Ask it a question": a question, the six tools, and the one the model calls */
.ask { margin: 0; padding: 0 10px 10px; display: grid; gap: 10px; align-content: start; min-width: 0; transform: translateZ(28px); }
.ask__in { display: grid; gap: 12px; padding: 18px; border-radius: var(--radius); background: var(--surface-2); min-width: 0; }
.ask__label { font-family: var(--font-mono); font-size: var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-2); }
.ask__bubble {
  justify-self: start; max-width: 100%; padding: 10px 16px; border-radius: 16px 16px 16px 4px;
  background: var(--surface); border: 1px solid var(--line);
  font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: -.015em; line-height: 1.35;
  transition: opacity .25s var(--ease);
}
.ask__bubble.is-swapping { opacity: 0; }
.ask__hint { font-size: .875rem; color: color-mix(in srgb, var(--ink) 88%, var(--muted)); }
.ask__tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 148px), 1fr)); gap: 6px; }
.ask__tool {
  font-family: var(--font-mono); font-size: var(--label); padding: 9px 10px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
}
.ask__tool.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.ask__chain { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--font-mono); font-size: var(--label); color: var(--ink); }
.ask__arrow { color: var(--accent-2); }
.ask__note { font-size: .875rem; color: var(--muted); padding: 0 8px; }
@media (max-width: 560px) {
  .ask__in { padding: 12px; }
  .ask__tool { padding-inline: 8px; }
}

@media (min-width: 961px) {
  /* the picture sits under the photos, beside the write-up */
  .card--featured { grid-template-rows: auto 1fr; }
  .card--featured .card__media { grid-column: 1; grid-row: 1; }
  .card--featured .card__body { grid-column: 2; grid-row: 1 / span 2; }
  .card--featured .ask { grid-column: 1; grid-row: 2; }
}

@media (max-width: 960px) {
  .card--featured { grid-template-columns: minmax(0, 1fr); }
  .card--featured .card__media > .photo { aspect-ratio: 16 / 9; }
  .card--featured .card__body { padding: 16px 22px 22px; }
}

/* ---------- Skills ---------- */
.skill-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 22px 24px; min-width: 0; }
.skill-group { display: grid; gap: 10px; align-content: start; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
#cert-wrap { grid-column: 1 / -1; }   /* the certifications list gets the full row */
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 10px; font-weight: 500; font-size: 1rem;
  background: var(--surface); border: 1px solid var(--line);
}
.badge--cert { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.badge--cert svg { width: 16px; height: 16px; color: var(--accent); flex: none; }

/* ---------- Beyond engineering: compact rows ---------- */
.beyond-list { display: grid; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.beyond-list li + li { border-top: 1px solid var(--line); }
.beyond-row {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 12px 16px; text-decoration: none; color: inherit; font-size: 1rem; line-height: 1.5;
}
a.beyond-row { transition: background-color .2s; }
a.beyond-row:hover { background: var(--surface-2); }
.beyond-row__icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
.beyond-row__icon svg { width: 18px; height: 18px; }
.beyond-row b { font-weight: 600; }
.beyond-row__go { width: 18px; height: 18px; color: var(--muted); transition: color .2s, transform .25s var(--ease); }
.beyond-row__go svg { width: 18px; height: 18px; display: block; }
a.beyond-row:hover .beyond-row__go { color: var(--accent); transform: translate(2px, -2px); }

/* ---------- Contact ---------- */
.contact { position: relative; overflow: hidden; }
.contact .wrap { display: grid; gap: 20px; justify-items: start; }
.contact__title {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 5.2rem);
  line-height: .98; letter-spacing: -.04em; max-width: 14ch;
}
.contact__title span { color: var(--accent); }
.contact__blurb { color: var(--muted); max-width: 54ch; font-size: 1.125rem; }
.contact__email {
  display: inline-flex; align-items: center; gap: 12px; max-width: 100%;
  padding: 12px 22px 12px 18px; border-radius: 99px; text-decoration: none;
  background: var(--accent); color: var(--on-accent); font-weight: 600;
  box-shadow: 0 10px 30px -12px var(--accent);
  transition: transform .25s var(--ease), box-shadow .25s;
}
.contact__email:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -12px var(--accent); }
.contact__email svg { width: 18px; height: 18px; flex: none; }
.contact__address { font-family: var(--font-mono); font-size: clamp(1rem, 2.4vw, 1.15rem); overflow-wrap: anywhere; min-width: 0; }
.socials { display: flex; flex-wrap: wrap; gap: 10px; }
.socials a {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 500;
  padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); transition: border-color .2s, transform .25s var(--ease);
}
.socials a:hover { border-color: var(--accent); transform: translateY(-2px); }

/* ---------- Footer ---------- */
.footer { border-top: 1px solid var(--line); padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
.footer__inner { font-size: .875rem; color: var(--muted); }

/* ---------- Detail panel: slides in from the side when a card's button is pressed ---------- */
.sheet {
  position: fixed; inset: 0 0 0 auto; margin: 0; padding: 0; border: 0;
  width: min(640px, 100vw); max-width: 100vw; height: 100vh; height: 100dvh; max-height: none;
  background: var(--surface); color: var(--ink); border-left: 1px solid var(--line);
  box-shadow: -30px 0 80px -30px rgba(0, 0, 0, .6);
  overflow-y: auto; overscroll-behavior: contain;
}
.sheet::backdrop { background: rgba(5, 10, 11, .62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet[open] { animation: sheet-in .32s var(--ease); }
.sheet[open]::backdrop { animation: sheet-fade .32s ease; }
@keyframes sheet-in { from { transform: translateX(40px); opacity: 0; } }
@keyframes sheet-fade { from { opacity: 0; } }
html.sheet-open { overflow: hidden; }
.sheet__bar {
  position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 24px 12px;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.sheet__eyebrow { font-family: var(--font-mono); font-size: var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet__close { padding: 10px 16px; font-size: .9375rem; }
.sheet__body { padding: 26px 24px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
.sheet__head { display: grid; gap: 8px; }
.sheet__title { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.03em; line-height: 1.1; margin: 0; }
.sheet__sub { color: var(--accent); font-weight: 600; }
.sheet__intro { font-size: 1.0625rem; }
.sheet__fact { background: var(--surface-2); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 4px; }
.sheet__label { font-family: var(--font-mono); font-weight: 500; font-size: var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
.sheet__section { display: grid; gap: 6px; }
.sheet__lead { margin: 0; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.sheet__lead img { display: block; width: 100%; height: auto; max-height: min(420px, 60vh); object-fit: cover; }
.sheet__gallery { columns: 2; column-gap: 10px; }
.sheet__gallery--wide { columns: 1; }
.sheet__gallery figure { margin: 0 0 10px; break-inside: avoid; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.sheet__gallery img { display: block; width: 100%; height: auto; }
.sheet__press, .job__press {
  display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--accent-2);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px;
}
.sheet__press svg, .job__press svg { width: 16px; height: 16px; flex: none; }
.sheet__press-note { color: var(--muted); font-size: .9375rem; }
.more-btn { justify-self: start; padding: 10px 16px; font-size: .9375rem; }
.card__actions, .job__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
@media (max-width: 599px) { .sheet__body { padding-inline: 18px; } .sheet__bar { padding-inline: 18px; } }

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

  <header class="nav" id="nav">
    <div class="wrap nav__inner">
      <a class="nav__brand" href="#top" id="nav-brand" aria-label="ZZ. Back to top"></a>
      <nav class="nav__links" id="nav-links" aria-label="Sections">
        <a href="#about" data-section="about">About</a>
        <a href="#projects" data-section="projects">Projects</a>
        <a href="#experience" data-section="experience">Experience</a>
        <a href="#skills" data-section="skills">Skills</a>
        <a href="#contact" data-section="contact">Contact</a>
      </nav>
      <div class="nav__actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch color theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        </button>
        <button class="icon-btn nav__menu" id="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- HERO -->
    <section class="hero" id="top" aria-labelledby="hero-name">
      <div class="hero__stage">
        <div class="hero__media" aria-hidden="true">
          <video class="hero__video" id="hero-video" muted playsinline preload="none" poster="hero-poster.jpg" tabindex="-1" disablepictureinpicture disableremoteplayback></video>
        </div>
        <div class="wrap hero__inner">
        <p class="hero__status" id="hero-status" hidden><span class="pulse" aria-hidden="true"></span><span id="hero-status-text"></span></p>
        <h1 class="hero__name" id="hero-name"></h1>
        <p class="hero__role" id="hero-role"></p>
        <p class="hero__tagline" id="hero-tagline"></p>
        <div class="hero__cta" id="hero-cta"></div>
        <dl class="hero__meta" id="hero-meta"></dl>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="section" id="about" aria-labelledby="about-title">
      <div class="wrap section__grid">
        <header class="section__label reveal">
          <p class="kicker">About</p>
          <h2 class="section__title" id="about-title">Student, builder, teacher</h2>
        </header>
        <div class="about">
          <div class="prose reveal" id="about-body"></div>
          <div class="idcard-wrap reveal" id="idcard-wrap"></div>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="wrap section__grid">
        <header class="section__label reveal">
          <p class="kicker">Projects</p>
          <h2 class="section__title" id="projects-title">Things I've built</h2>
        </header>
        <div class="cards" id="project-grid"></div>
      </div>
    </section>

    <!-- EXPERIENCE (with On campus) -->
    <section class="section" id="experience" aria-labelledby="experience-title">
      <div class="wrap section__grid">
        <header class="section__label reveal">
          <p class="kicker">Experience</p>
          <h2 class="section__title" id="experience-title">Where I've worked</h2>
        </header>
        <div class="section__body">
          <div class="timeline-wrap">
            <span class="timeline__track" aria-hidden="true"><span class="timeline__fill" id="timeline-fill"></span></span>
            <ol class="timeline" id="timeline"></ol>
          </div>
          <div id="oncampus">
            <h3 class="subhead">On campus</h3>
            <div class="lead-grid" id="oncampus-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- SKILLS -->
    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="wrap section__grid">
        <header class="section__label reveal">
          <p class="kicker">Skills</p>
          <h2 class="section__title" id="skills-title">Toolkit</h2>
        </header>
        <div class="skill-groups" id="skill-groups">
          <div class="skill-group reveal" id="cert-wrap">
            <h3 class="minor-title">Certifications</h3>
            <ul class="badges" id="cert-list"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- BEYOND ENGINEERING -->
    <section class="section" id="beyond" aria-labelledby="beyond-title">
      <div class="wrap section__grid">
        <header class="section__label reveal">
          <p class="kicker">Beyond engineering</p>
          <h2 class="section__title" id="beyond-title">Off the clock</h2>
        </header>
        <ul class="beyond-list reveal" id="beyond-list"></ul>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <div class="wrap">
        <p class="kicker reveal">Contact</p>
        <h2 class="contact__title" id="contact-title"></h2>
        <p class="contact__blurb" id="contact-blurb"></p>
        <a class="contact__email" id="contact-email" hidden></a>
        <ul class="socials" id="socials"></ul>
      </div>
    </section>
  </main>

  <script>
/* ==========================================================================
   main.js: renders the page from window.PROFILE and wires up interactions.
   No framework, no build step. All user data is inserted as text, never HTML.
   ========================================================================== */
(() => {
  'use strict';

  const P = window.PROFILE || {};
  const root = document.documentElement;
  const $ = (sel, scope = document) => scope.querySelector(sel);
  const $$ = (sel, scope = document) => Array.from(scope.querySelectorAll(sel));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const list = (v) => (Array.isArray(v) ? v.filter(Boolean) : []);

  /* ---------- DOM helper ---------- */
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const c of children.flat()) {
      if (c == null || c === false || c === '') continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  // Absolute links (http/https/mailto) or relative paths to your own files, e.g. "images/car.jpg".
  /* A small picture of how the assistant answers: a question, its tools, and the one it calls. */
  function askDemo(d) {
    const qs = list(d.questions);
    const tools = list(d.tools);
    if (!qs.length || !tools.length) return null;
    const quote = h('span');
    const bubble = h('p', { class: 'ask__bubble' }, quote);
    const cells = tools.map((t) => h('li', { class: 'ask__tool', 'data-tool': t, text: `${t}()` }));
    const show = (i) => {
      quote.textContent = `\u201C${qs[i].ask}\u201D`;
      cells.forEach((c) => c.classList.toggle('is-on', c.dataset.tool === qs[i].tool));
    };
    show(0);
    const chain = list(d.chain).flatMap((c, i) => [i ? h('span', { class: 'ask__arrow', text: '\u2192' }) : null, h('span', { text: c })]);
    const el = h('figure', { class: 'ask', 'aria-label': d.summary || null },
      h('div', { class: 'ask__in', 'aria-hidden': 'true' },
        d.label ? h('p', { class: 'ask__label', text: d.label }) : null,
        bubble,
        d.hint ? h('p', { class: 'ask__hint', text: d.hint }) : null,
        h('ul', { class: 'ask__tools' }, cells),
        chain.length ? h('p', { class: 'ask__chain' }, chain) : null
      ),
      d.note ? h('figcaption', { class: 'ask__note', text: d.note }) : null
    );
    // With motion allowed, the questions take turns and each lights up its own tool.
    if (qs.length > 1 && !reduceMotion) {
      let i = 0;
      setInterval(() => {
        if (document.hidden) return;
        bubble.classList.add('is-swapping');
        setTimeout(() => { i = (i + 1) % qs.length; show(i); bubble.classList.remove('is-swapping'); }, 260);
      }, 4200);
    }
    return el;
  }

  /* "Built with ..." line; a collaborator's name can link to their own site. */
  function collabLine(p) {
    const text = p.collaborators;
    const link = p.collaboratorLink;
    const url = link && safeUrl(link.url);
    const at = url && link.name ? text.indexOf(link.name) : -1;
    if (at < 0) return h('p', { class: 'card__collab', text });
    return h('p', { class: 'card__collab' },
      text.slice(0, at),
      h('a', external(url), link.name),
      text.slice(at + link.name.length)
    );
  }

  function safeUrl(u) {
    if (!u || typeof u !== 'string') return null;
    const s = u.trim();
    if (/^(https?:\/\/|mailto:)/i.test(s)) return s;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return null;      // block javascript:, data:, etc.
    return s;
  }
  // Attributes for a link that leaves the site.
  const external = (href) => ({ href, target: '_blank', rel: 'noopener noreferrer' });

  const ICON = {
    arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M7 17 17 7M9 7h8v8"/></svg>',
    mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="m4 7 8 6 8-6"/></svg>',
    camera: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path fill="currentColor" d="M10 9.2v5.6l4.8-2.8z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path fill="currentColor" d="M7 10h2v7H7zm1-3.6a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zM11 10h2v1c.5-.8 1.3-1.2 2.3-1.2 1.8 0 2.7 1.1 2.7 3.2v4h-2v-3.7c0-1-.4-1.6-1.3-1.6-.9 0-1.7.6-1.7 1.8V17h-2z"/></svg>',
    car: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M3 15v-3l2-1 2.5-4h8L18 11l3 1v3h-2M7 15h8"/><circle cx="7" cy="15.5" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="15.5" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    panel: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M14.5 4.5v15"/></svg>',
    star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg>'
  };
  const icon = (name) => { const t = document.createElement('template'); t.innerHTML = ICON[name] || ICON.star; return t.content.firstChild; };

  /* ---------- Renderers ---------- */
  function renderHero() {
    const p = P.person || {};
    const words = String(p.name || '').trim().split(/\s+/).filter(Boolean);

    $('#nav-brand').append(words.map((w) => w[0]).join('').toUpperCase(), h('span', { text: '.' }));

    const name = $('#hero-name');
    name.setAttribute('aria-label', p.name || '');
    name.append(
      h('span', { class: 'line line--solid', 'aria-hidden': 'true', text: words[0] || '' }),
      words.length > 1 && h('span', { class: 'line line--outline', 'aria-hidden': 'true', 'data-text': words.slice(1).join(' '), text: words.slice(1).join(' ') })
    );

    $('#hero-role').textContent = p.role || '';
    $('#hero-tagline').textContent = p.tagline || '';

    if (p.status) {
      $('#hero-status').hidden = false;
      $('#hero-status-text').textContent = p.status;
    }

    const cta = $('#hero-cta');
    if (p.email) cta.append(h('a', { class: 'btn btn--primary', href: `mailto:${p.email}` }, icon('mail'), 'Email me'));
    const li = safeUrl(p.linkedin);
    if (li) cta.append(h('a', { class: 'btn btn--ghost', ...external(li) }, 'LinkedIn', icon('arrow')));

    const meta = $('#hero-meta');
    list(p.facts).forEach((f) => meta.append(h('div', null, h('dt', { text: f.label }), h('dd', { text: f.value }))));
  }

  function renderAbout() {
    if (P.about) $('#about-body').append(h('p', { text: P.about }));

    // Education card; tilts in 3D like the project cards.
    const edu = P.education;
    const wrap = $('#idcard-wrap');
    if (edu) {
      wrap.append(h('article', { class: 'idcard', 'data-tilt': '', 'aria-label': 'Education' },
        h('p', { class: 'idcard__school', text: edu.school }),
        h('p', { class: 'idcard__degree', text: edu.degree }),
        edu.graduating ? h('p', { class: 'idcard__grad', text: edu.graduating }) : null
      ));
    } else wrap.hidden = true;
  }

  function monogram(str) {
    const words = String(str || '').replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter((w) => w && /^\p{Lu}/u.test(w));
    return (words.length ? words : [String(str || '?')]).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  }

  function chips(arr, label = 'Tags') {
    return h('ul', { class: 'chips', 'aria-label': label }, list(arr).map((t) => h('li', { class: 'chip', text: t })));
  }

  // The one picture on a job card. With a details panel it is also a button that opens the panel.
  function jobMedia(e, sheetData) {
    const one = (pic, label) => {
      const img = h('img', { src: safeUrl(pic.src), alt: pic.alt || '', loading: 'lazy', decoding: 'async' });
      if (pic.pos) img.style.objectPosition = pic.pos;
      if (!sheetData) return h('figure', { class: 'job__media' }, img);
      const btn = h('button', { class: 'job__media', type: 'button', 'aria-haspopup': 'dialog', 'aria-label': label }, img);
      btn.addEventListener('click', () => openSheet(sheetData()));
      return btn;
    };
    if (!safeUrl(e.image && e.image.src)) return h('div', { class: 'job__media job__media--mono', 'aria-hidden': 'true', text: monogram(e.company) });
    const first = one(e.image, `More details: ${e.role}`);
    if (!safeUrl(e.image2 && e.image2.src)) return first;
    return h('div', { class: 'job__pics' }, first, one(e.image2, `More details: ${e.role}, second photo`));
  }

  function renderExperience() {
    const ol = $('#timeline');
    list(P.experience).forEach((e) => {
      const isCurrent = e.current === true;
      const sheetData = e.details ? () => ({
        eyebrow: 'Experience',
        title: e.role,
        sub: e.company,
        lead: e.image,
        images: e.image2 ? [e.image2] : [],
        intro: e.details.intro,
        fact: e.details.fact,
        sections: e.details.sections,
        press: e.press,
        tags: e.tags
      }) : null;
      ol.append(h('li', { class: `job reveal${isCurrent ? ' job--current' : ''}` },
        h('span', { class: 'job__dot', 'aria-hidden': 'true' }),
        h('article', { class: 'job__card', 'data-tilt': 'soft' },
         h('div', { class: 'job__body' },
          h('div', { class: 'job__head' },
            (isCurrent || e.dates) ? h('div', { class: 'job__meta' },
              isCurrent ? h('span', { class: 'job__now', text: 'Now' }) : null,
              e.dates ? h('p', { class: 'job__when', text: e.dates }) : null
            ) : null,
            h('div', { class: 'job__titles' },
              h('h3', { class: 'job__role', text: e.role }),
              h('p', { class: 'job__sub' }, h('span', { class: 'job__company', text: e.company }), e.location ? h('span', { text: e.location }) : null)
            )
          ),
          e.summary ? h('p', { class: 'job__summary', text: e.summary }) : null,
          list(e.achievements).length ? h('ul', { class: 'job__wins' }, list(e.achievements).map((t) => h('li', { text: t }))) : null,
          list(e.tags).length ? chips(e.tags) : null,
          (pressLink(e.press, 'job__press') || e.details) ? h('div', { class: 'job__actions' },
            e.details ? sheetButton('More details', sheetData) : null,
            pressLink(e.press, 'job__press')
          ) : null
         ),
         jobMedia(e, sheetData)
        )
      ));
    });

    const items = list(P.onCampus);
    const wrap = $('#oncampus-list');
    items.forEach((l) => wrap.append(h('article', { class: 'lead reveal', 'data-tilt': '' },
      h('div', { class: 'lead__top' },
        h('h4', { class: 'lead__title', text: l.title }),
        l.badge ? h('span', { class: 'lead__badge', text: l.badge }) : null
      ),
      l.org ? h('p', { class: 'lead__org', text: l.org }) : null,
      l.description ? h('p', { text: l.description }) : null
    )));
    $('#oncampus').hidden = !items.length;
  }

  function photo(img, title, i) {
    return h('figure', { class: 'photo' },
      h('img', { src: safeUrl(img.src), alt: img.alt || `${title} photo ${i + 1}`, loading: i ? 'lazy' : 'eager', decoding: 'async', width: 1000, height: 700 }));
  }

  const caseSteps = (p) => list(p.caseStudy && p.caseStudy.steps).filter((st) => st.heading && st.text);

  function renderProjects() {
    const items = list(P.projects).slice().sort((a, b) => (b.featured === true) - (a.featured === true));
    const grid = $('#project-grid');
    items.forEach((p) => {
      const imgs = list(p.images).filter((img) => safeUrl(img?.src));
      const statusClass = /live|work|tested|done|complete/i.test(p.status || '') ? 'ok' : 'wip';
      const status = p.status ? h('span', { class: `card__status card__status--${statusClass}`, text: p.status }) : null;
      const photos = imgs.map((img, i) => photo(img, p.title, i));
      const featured = p.featured && imgs.length;

      grid.append(h('article', { class: `card reveal${featured ? ' card--featured' : ''}${imgs.length ? '' : ' card--text'}`, 'data-tilt': featured ? 'soft' : '' },
        imgs.length ? h('div', { class: 'card__media' },
          photos[0],
          photos.length > 1 ? h('div', { class: 'card__thumbs' }, photos.slice(1)) : null,
          status
        ) : null,
        h('div', { class: 'card__body' },
          h('div', { class: 'card__eyebrow' },
            featured ? h('span', { class: 'card__flag', text: 'Featured' }) : null,
            imgs.length ? null : status,
            p.role ? h('span', { text: p.role }) : null
          ),
          h('h3', { class: 'card__title', text: p.title }),
          p.collaborators ? collabLine(p) : null,
          p.description ? h('p', { class: 'card__desc', text: p.description }) : null,
          list(p.highlights).length ? h('ul', { class: 'job__wins' }, list(p.highlights).map((t) => h('li', { text: t }))) : null,
          list(p.tech).length ? chips(p.tech, 'Tools') : null,
          (caseSteps(p).length || safeUrl(p.repo)) ? h('div', { class: 'card__actions' },
            caseSteps(p).length ? sheetButton('Case study', () => ({
              eyebrow: 'Project',
              title: p.title,
              sub: p.caseStudy.title,
              intro: p.description,
              sections: caseSteps(p),
              images: imgs,
              wide: true,
              tags: p.tech
            })) : null,
            safeUrl(p.repo) ? h('a', { class: 'btn btn--ghost more-btn', ...external(safeUrl(p.repo)) }, 'GitHub', icon('arrow')) : null
          ) : null
        ),
        p.demo ? askDemo(p.demo) : null
      ));
    });
  }

  function renderSkills() {
    const wrap = $('#skill-groups');
    const certs = $('#cert-wrap');
    list(P.skills).forEach((g) => {
      wrap.insertBefore(h('div', { class: 'skill-group reveal' },
        h('h3', { class: 'minor-title', text: g.group }),
        h('ul', { class: 'badges' }, list(g.items).map((n) => h('li', { class: 'badge', text: n })))
      ), certs);
    });

    const cl = $('#cert-list');
    list(P.certifications).forEach((c) => {
      cl.append(h('li', { class: 'badge badge--cert' }, icon('star'), [c.name, c.issuer].filter(Boolean).join(', ')));
    });
    certs.hidden = !list(P.certifications).length;
  }

  function renderBeyond() {
    const ul = $('#beyond-list');
    list(P.beyond).forEach((b) => {
      const href = safeUrl(b.url);
      const inner = [
        h('span', { class: 'beyond-row__icon', 'aria-hidden': 'true' }, icon(b.kind)),
        h('span', null, h('b', { text: b.label }), `: ${b.text}`),
        href ? h('span', { class: 'beyond-row__go', 'aria-hidden': 'true' }, icon('arrow')) : null
      ];
      ul.append(h('li', null, href ? h('a', { class: 'beyond-row', ...external(href) }, inner) : h('div', { class: 'beyond-row' }, inner)));
    });
    $('#beyond').hidden = !list(P.beyond).length;
  }

  function renderContact() {
    const c = P.contact || {}, p = P.person || {};
    const heading = String(c.heading || "Let's talk.").trim();
    const cut = heading.lastIndexOf(' ');
    const title = $('#contact-title');
    if (cut > 0) title.append(heading.slice(0, cut + 1), h('span', { text: heading.slice(cut + 1) }));
    else title.textContent = heading;
    $('#contact-blurb').textContent = c.blurb || '';

    if (p.email) {
      const mail = $('#contact-email');
      mail.href = `mailto:${p.email}`;
      mail.append(icon('mail'), h('span', { class: 'contact__address', text: p.email }));
      mail.hidden = false;
    }

    const soc = $('#socials');
    list(P.socials).forEach((s) => {
      const href = safeUrl(s.url);
      if (href) soc.append(h('li', null, h('a', external(href), s.label)));
    });
  }

  function renderFooter() {
    $('#footer').append(h('p', { text: P.footer || '' }));
  }

  /* ---------- 3D tilt (cards, ID card). data-tilt="soft" = gentler, for big cards ---------- */
  function initTilt() {
    if (!finePointer || reduceMotion) return;
    $$('[data-tilt]').forEach((card) => {
      const k = card.dataset.tilt === 'soft' ? 0.4 : 1;
      card.addEventListener('pointermove', (e) => {
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        card.classList.add('is-tilting');
        card.style.setProperty('--ry', `${((px - 0.5) * 14 * k).toFixed(2)}deg`);
        card.style.setProperty('--rx', `${((0.5 - py) * 12 * k).toFixed(2)}deg`);
        card.style.setProperty('--gx', `${(px * 100).toFixed(1)}%`);
        card.style.setProperty('--gy', `${(py * 100).toFixed(1)}%`);
        card.style.setProperty('--glare', '1');
      });
      card.addEventListener('pointerleave', () => {
        card.classList.remove('is-tilting');
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--glare', '0');
      });
    });
  }

  /* ---------- Extruded 3D name that follows the pointer ---------- */
  function initExtrude() {
    const solid = $('.hero__name .line--solid');
    if (!solid) return;
    const LAYERS = 10;
    const paint = (dx, dy) => {
      const s = [];
      for (let i = 1; i <= LAYERS; i++) {
        const pct = Math.round(70 - i * 5);
        s.push(`${(dx * i).toFixed(2)}px ${(dy * i).toFixed(2)}px 0 color-mix(in srgb, var(--accent) ${pct}%, transparent)`);
      }
      solid.style.textShadow = s.join(', ');
    };
    paint(0.6, 0.6);
    if (!finePointer || reduceMotion) return;
    let tx = 0.6, ty = 0.6, cx = tx, cy = ty, raf = 0;
    const step = () => {
      cx += (tx - cx) * 0.12; cy += (ty - cy) * 0.12;
      paint(cx, cy);
      raf = Math.abs(tx - cx) + Math.abs(ty - cy) > 0.01 ? requestAnimationFrame(step) : 0;
    };
    addEventListener('pointermove', (e) => {
      const r = solid.getBoundingClientRect();
      const nx = (e.clientX - (r.left + r.width / 2)) / innerWidth;
      const ny = (e.clientY - (r.top + r.height / 2)) / innerHeight;
      tx = Math.max(-1, Math.min(1, -nx * 2.2));
      ty = Math.max(-1, Math.min(1, -ny * 2.2));
      if (!raf) raf = requestAnimationFrame(step);
    }, { passive: true });
  }

  /* ---------- Timeline: the line fills and dots light up as you scroll ---------- */
  function initTimeline() {
    const wrap = $('.timeline-wrap'), fill = $('#timeline-fill');
    if (!wrap || !fill) return;
    const jobs = $$('.job', wrap);
    let queued = false;
    const update = () => {
      queued = false;
      const r = wrap.getBoundingClientRect();
      const line = innerHeight * 0.6;                      // the "reading line" on screen
      const p = Math.max(0, Math.min(1, (line - r.top) / r.height));
      fill.style.transform = `scaleY(${p.toFixed(4)})`;
      jobs.forEach((j) => j.classList.toggle('lit', j.getBoundingClientRect().top + 30 < line));
    };
    addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
    addEventListener('resize', update);
    update();
  }

  /* ---------- Chrome: theme, menu, progress, active link, reveal ---------- */
  function initTheme() {
    const btn = $('#theme-toggle');
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const current = () => root.dataset.theme || (mq.matches ? 'dark' : 'light');
    const label = () => btn.setAttribute('aria-label', current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    label();
    btn.addEventListener('click', () => {
      const next = current() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch {}
      label();
    });
    mq.addEventListener?.('change', label);
  }

  function initMenu() {
    const nav = $('#nav'), btn = $('#menu-toggle');
    const set = (open) => {
      nav.dataset.open = String(open);
      btn.setAttribute('aria-expanded', String(open));
      btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    };
    btn.addEventListener('click', () => set(nav.dataset.open !== 'true'));
    $$('#nav-links a').forEach((a) => a.addEventListener('click', () => set(false)));
    addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
  }

  function initProgress() {
    const bar = $('#progress-bar');
    let queued = false;
    const update = () => {
      queued = false;
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
    };
    addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
    update();
  }

  function initActiveLink() {
    const links = $$('#nav-links a');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        links.forEach((a) => {
          if (a.dataset.section === en.target.id) a.setAttribute('aria-current', 'true');
          else a.removeAttribute('aria-current');
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    $$('main > section[id]').forEach((s) => io.observe(s));
  }

  // Content is always visible; scrolling an element into view adds a short 3D settle animation.
  function initReveal() {
    if (reduceMotion || !('IntersectionObserver' in window)) return;
    root.classList.add('js-motion');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    $$('.reveal').forEach((el) => {
      const siblings = Array.from(el.parentElement.children).filter((c) => c.classList.contains('reveal'));
      el.style.animationDelay = `${Math.min(siblings.indexOf(el), 4) * 60}ms`;
      io.observe(el);
    });
  }

  /* ---------- Hero video that moves forward as you scroll ---------- */
  function initScrollHero() {
    const hero = $('#top'), stage = $('.hero__stage'), media = $('.hero__media'), video = $('#hero-video');
    if (!hero || !stage || !media || !video) return;
    const off = () => root.classList.add('no-scrub');   // falls back to the still first frame
    const saveData = !!(navigator.connection && navigator.connection.saveData);
    if (reduceMotion || saveData) return off();

    const wide = matchMedia('(min-width: 861px) and (min-height: 620px)');
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    let target = 0, current = 0, shown = -1, ready = false, raf = 0;

    const tick = () => {
      raf = 0;
      current += (target - current) * 0.2;
      if (Math.abs(target - current) < 0.0015) current = target;
      if (ready && !video.seeking) {
        const t = current * Math.max(0, video.duration - 0.05);
        if (Math.abs(t - shown) > 0.012) { shown = t; video.currentTime = t; }
      }
      if (current !== target || (ready && video.seeking)) raf = requestAnimationFrame(tick);
    };

    const measure = () => {
      const pin = wide.matches ? stage : media;
      const travel = hero.offsetHeight - pin.offsetHeight;
      const top = parseFloat(getComputedStyle(pin).top) || 0;
      target = travel > 0 ? clamp01((top - hero.getBoundingClientRect().top) / travel) : 0;
      // On large screens the text and its dark backing fade away so the end of the clip is clear.
      const fade = wide.matches ? 1 - clamp01((target - 0.5) / 0.28) : 1;
      hero.style.setProperty('--hero-fade', fade.toFixed(3));
      hero.classList.toggle('is-clear', fade < 0.02);
      if (!raf) raf = requestAnimationFrame(tick);
    };

    // Phones only decode frames for a video that has been played once, so play and pause straight away.
    const prime = () => {
      const p = video.play();
      const done = () => { video.pause(); shown = -1; measure(); };
      if (p && p.then) p.then(done).catch(() => addEventListener('touchstart', prime, { once: true, passive: true }));
      else done();
    };

    const start = (url) => {
      video.addEventListener('loadeddata', () => { ready = true; prime(); measure(); }, { once: true });
      video.addEventListener('error', () => { if (!ready) off(); }, { once: true });
      video.preload = 'auto';
      video.src = url;
      video.load();
    };

    // Download the whole clip first so every frame is in memory and scrubbing never waits on the network.
    const src = matchMedia('(max-width: 860px)').matches ? 'hero-mobile.mp4' : 'hero.mp4';
    fetch(src)
      .then((r) => (r.ok ? r.blob() : Promise.reject(new Error('video'))))
      .then((b) => start(URL.createObjectURL(b)))
      .catch(() => start(src));

    addEventListener('scroll', measure, { passive: true });
    addEventListener('resize', measure);
    wide.addEventListener('change', measure);
    measure();
  }

  /* ---------- Detail panel ---------- */
  function pressLink(press, cls) {
    const url = press && safeUrl(press.url);
    if (!url || !press.label) return null;
    return h('a', { class: cls, ...external(url) }, press.label, icon('arrow'));
  }

  function sheetButton(label, getData) {
    const btn = h('button', { class: 'btn btn--ghost more-btn', type: 'button', 'aria-haspopup': 'dialog' }, icon('panel'), label);
    btn.addEventListener('click', () => openSheet(getData()));
    return btn;
  }

  function leadImg(img) {
    const src = safeUrl(img && img.src);
    if (!src) return null;
    const el = h('img', { src, alt: img.alt || '', decoding: 'async' });
    if (img.pos) el.style.objectPosition = img.pos;
    return h('figure', { class: 'sheet__lead' }, el);
  }

  function openSheet(d) {
    const dlg = $('#sheet');
    if (!dlg || typeof dlg.showModal !== 'function') return;
    const imgs = list(d.images).filter((img) => safeUrl(img && img.src));
    $('#sheet-eyebrow').textContent = d.eyebrow || '';
    $('#sheet-body').replaceChildren(...[
      h('div', { class: 'sheet__head' },
        h('h2', { class: 'sheet__title', id: 'sheet-title', text: d.title || '' }),
        d.sub ? h('p', { class: 'sheet__sub', text: d.sub }) : null
      ),
      leadImg(d.lead),
      d.intro ? h('p', { class: 'sheet__intro', text: d.intro }) : null,
      d.fact && d.fact.text ? h('div', { class: 'sheet__fact' },
        h('p', { class: 'sheet__label', text: d.fact.label || '' }),
        h('p', { text: d.fact.text })
      ) : null,
      ...list(d.sections).filter((st) => st.heading && st.text).map((st) => h('section', { class: 'sheet__section' },
        h('h3', { class: 'sheet__label', text: st.heading }),
        h('p', { text: st.text })
      )),
      imgs.length ? h('div', { class: `sheet__gallery${d.wide ? ' sheet__gallery--wide' : ''}` },
        imgs.map((img) => h('figure', null, h('img', { src: safeUrl(img.src), alt: img.alt || '', loading: 'lazy', decoding: 'async' })))
      ) : null,
      pressLink(d.press, 'sheet__press') ? h('div', { class: 'sheet__section' },
        h('h3', { class: 'sheet__label', text: 'In the news' }),
        pressLink(d.press, 'sheet__press'),
        d.press.note ? h('p', { class: 'sheet__press-note', text: d.press.note }) : null
      ) : null,
      list(d.tags).length ? chips(d.tags) : null
    ].filter(Boolean));
    // Stop the page behind from scrolling, without the content jumping when its scrollbar goes away.
    root.style.paddingRight = `${Math.max(0, innerWidth - root.clientWidth)}px`;
    root.classList.add('sheet-open');
    dlg.showModal();
    dlg.scrollTop = 0;
  }

  function initSheet() {
    const dlg = $('#sheet');
    if (!dlg) return;
    $('#sheet-close').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });   // a click on the dimmed page closes it
    dlg.addEventListener('close', () => { root.classList.remove('sheet-open'); root.style.paddingRight = ''; });
  }

  /* ---------- Boot ---------- */
  renderHero();
  renderAbout();
  renderProjects();
  renderExperience();
  renderSkills();
  renderBeyond();
  renderContact();
  renderFooter();
  root.classList.remove('js-pending');

  initTheme();
  initMenu();
  initProgress();
  initActiveLink();
  initReveal();
  initTilt();
  initExtrude();
  initScrollHero();
  initSheet();
  initTimeline();
})();
</script>
</body></html>
